# Controlled mixed-transfer WAN topology.
# All flows have equal three-link path length and share S0->S1.

topology:
  switches:
    S0:
      terminals: 6
      terminal_bandwidth: "200 Gbps"
      switch_buffer: "2.0 GB"
      connections:
        S1: "200 Gbps"

    S1:
      terminals: 6
      terminal_bandwidth: "200 Gbps"
      switch_buffer: "2.0 GB"
      connections:
        S0: "200 Gbps"
