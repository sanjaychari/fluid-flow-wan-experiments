schema_version: 1

topology:
  format: groups
  params:
    message_size: 32768
    pe_mem_factor: 1024
  groups:
    FLUID_FLOW_WAN_GRP:
      repetitions: 1
      lps:
        fluid-flow-wan-switch-lp: 128
        fluid-flow-wan-terminal-lp: 256

sections:
  fluid_flow_wan:
    topology_yaml_file: "topology.yaml"
    traffic_trace_file: "traffic.csv"
    interval_seconds: 3600
    num_send_intervals: 1
    num_drain_intervals: 17
    egress_model: pdes
    debug_prints: 0
    backpressure_delay_ms: 1.0
    pause_high_watermark_fraction: 0.999999
    pause_low_watermark_fraction: 0.999998
